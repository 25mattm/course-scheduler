<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Scheduler</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #E8197A; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; }
        form { margin-top: 30px; display: flex; gap: 8px; flex-wrap: wrap; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 16px; background: #E8197A; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #c4156a; }
    </style>
</head>
<body>
<h1>Course Scheduler</h1>

<table id="courseTable">
    <thead>
    <tr><th>Code</th><th>Name</th><th>Instructor</th></tr>
    </thead>
    <tbody id="courseBody"></tbody>
</table>

<form id="addForm">
    <input type="text" id="code" placeholder="Code (e.g. CSCI 2110)" required>
    <input type="text" id="name" placeholder="Name" required>
    <input type="text" id="instructor" placeholder="Instructor" required>
    <button type="submit">Add Course</button>
</form>

<script>
    // Fetch all courses and fill the table
    async function loadCourses() {
        const response = await fetch('/courses');
        const courses = await response.json();
        const body = document.getElementById('courseBody');
        body.innerHTML = '';
        courses.forEach(course => {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${course.code}</td><td>${course.name}</td><td>${course.instructor}</td>`;
            body.appendChild(row);
        });
    }

    // Handle the add-course form
    document.getElementById('addForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const newCourse = {
            code: document.getElementById('code').value,
            name: document.getElementById('name').value,
            instructor: document.getElementById('instructor').value
        };
        await fetch('/courses', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newCourse)
        });
        document.getElementById('addForm').reset();
        loadCourses(); // refresh the table
    });

    // Load courses when the page opens
    loadCourses();
</script>
</body>
</html>
